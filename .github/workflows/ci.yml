name: ci

# Three gates, all of which have caught something real: the contracts have to pass their own tests
# and stay inside the size an account may hold, the TypeScript that talks to them has to compile
# against ABIs generated from those same artifacts, and static analysis may not report anything
# nobody has read. The suites that fork 4663 live in fork.yml.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: foundry-rs/foundry-toolchain@v1
      - run: npm ci
      - name: tests
        run: forge test --no-match-path 'test/Fork*.t.sol' -vv
      - name: size limit
        run: |
          forge build --sizes --json > sizes.json
          node -e "
            const s = JSON.parse(require('fs').readFileSync('sizes.json','utf8'));
            const over = Object.entries(s).filter(([n, v]) => v.runtime_size > 24576 && n.startsWith('Hood'));
            if (over.length) { console.error('over the limit:', over); process.exit(1); }
            console.log('all contracts fit');
          "

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: foundry-rs/foundry-toolchain@v1
      - run: npm ci
      - run: forge build
      - run: npm run abis
      - name: the generated ABIs have to match what is committed
        run: git diff --exit-code packages/sdk/src/abi.generated.ts
      - run: npx tsc -p packages/sdk/tsconfig.json
      - run: npx tsc -p packages/mcp/tsconfig.json --noEmit
      - run: npx tsc -p apps/api/tsconfig.json --noEmit
      - run: npx tsc -p apps/keeper/tsconfig.json --noEmit
      - run: npx tsc -p apps/web/tsconfig.json --noEmit

  static-analysis:
    runs-on: ubuntu-latest
    # Gating on what nobody has read: every current finding has a verdict in docs/SECURITY.md and a
    # line in docs/slither-baseline.json, and a new one fails the build until it gets both.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: pip install slither-analyzer==0.11.6
      # Slither exits non-zero whenever it reports anything; the gate below is the verdict.
      - run: slither . --filter-paths "lib/|node_modules/|test/|script/" --exclude-dependencies --exclude-informational --exclude-optimization --exclude-low --json slither.json || true
      - run: node scripts/slither-gate.mjs slither.json
